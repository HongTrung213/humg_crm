{% extends 'base.html' %}
{% load static %}

{% block content %}
<section class="login-section py-5 bg-light" style="min-height: 80vh; display: flex; align-items: center;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-8">
                <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                    <div class="card-header bg-primary text-center py-4 border-0">
                        <div class="mb-2">
                            <i class="feather-user-check text-white" style="font-size: 3rem;"></i>
                        </div>
                        <h4 class="text-white mb-0 fw-bold">Đăng Nhập Sinh Viên</h4>
                        <p class="text-white-50 mb-0 small">Cổng thông tin Chuẩn đầu ra HUMG</p>
                    </div>
                    
                    <div class="card-body p-4 p-md-5">
                        
                        <form method="POST" action="{% url 'dang_nhap' %}">
                            {% csrf_token %}
                            
                            <div class="mb-4">
                                <label class="form-label fw-bold text-dark">Mã số Sinh viên (MSSV)</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="feather-user"></i></span>
                                    <input type="text" class="form-control border-start-0 ps-0" name="mssv" placeholder="Nhập MSSV của bạn" required autofocus>
                                </div>
                            </div>
                            
                            <div class="mb-4">
                                <label class="form-label fw-bold text-dark">Mật khẩu</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="feather-lock"></i></span>
                                    <input type="password" class="form-control border-start-0 ps-0" name="password" placeholder="Nhập mật khẩu" required>
                                </div>
                                <div class="form-text mt-2 small text-muted">
                                    <i class="feather-info text-info"></i> Mật khẩu mặc định là <strong>cfihumg</strong>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold text-uppercase" style="letter-spacing: 1px;">
                                Đăng Nhập
                            </button>
                        </form>
                        
                        <div class="text-center mt-4">
                            <p class="small text-muted mb-0">Chưa có tài khoản? Vui lòng liên hệ Admin.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
