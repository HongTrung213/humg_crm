{% load static %}
<div class="page-header row">
  <div class="header-logo-wrapper col-auto">
    <div class="logo-wrapper">
      <a href="{% url 'admin_mofi_dashboard' %}">
        <img class="img-fluid for-light" src="{% static 'mofi/images/logo/logo.png' %}" alt=""/>
        <img class="img-fluid for-dark" src="{% static 'mofi/images/logo/logo_light.png' %}" alt=""/>
      </a>
    </div>
  </div>
  <div class="col-4 col-xl-4 page-title">
    <h4 class="f-w-700">{% block page_title %}Bảng Điều Khiển{% endblock %}</h4>
  </div>
  <div class="header-wrapper col m-0">
    <div class="row">
      <form class="form-inline search-full col" action="#" method="get">
        <div class="form-group w-100">
          <div class="Typeahead Typeahead--twitterUsers">
            <div class="u-posRelative">
              <input class="demo-input Typeahead-input form-control-plaintext w-100" type="text" placeholder="Tìm kiếm nhanh sinh viên, lớp học..." name="q" title="" autofocus>
              <i class="close-search" data-feather="x"></i>
            </div>
          </div>
        </div>
      </form>
      <div class="header-logo-wrapper col-auto p-0">
        <div class="logo-wrapper"><a href="{% url 'admin_mofi_dashboard' %}"><img class="img-fluid" src="{% static 'mofi/images/logo/logo.png' %}" alt=""></a></div>
        <div class="toggle-sidebar">
          <svg class="stroke-icon sidebar-toggle status_toggle middle">
            <use href="{% static 'mofi/svg/icon-sprite.svg' %}#toggle-icon"></use>
          </svg>
        </div>
      </div>
      <div class="nav-right col-xxl-8 col-xl-6 col-md-7 col-8 pull-right right-header p-0 ms-auto">
        <ul class="nav-menus">
          <li>
            <span class="header-search">
              <svg><use href="{% static 'mofi/svg/icon-sprite.svg' %}#search"></use></svg>
            </span>
          </li>
          <li>
            <div class="mode">
              <svg><use href="{% static 'mofi/svg/icon-sprite.svg' %}#moon"></use></svg>
            </div>
          </li>
          <li class="profile-nav onhover-dropdown px-0 py-0">
            <div class="d-flex profile-media align-items-center">
              <img class="img-30" src="{% static 'mofi/images/dashboard/profile.png' %}" alt="">
              <div class="flex-grow-1">
                <span>{{ request.user.username|default:"Admin HUMG" }}</span>
                <p class="mb-0 font-outfit">Ban Giám đốc<i class="fa fa-angle-down"></i></p>
              </div>
            </div>
            <ul class="profile-dropdown onhover-show-div">
              <li><a href="{% url 'admin:index' %}"><i data-feather="database"></i><span>DB Admin</span></a></li>
              <li><a href="{% url 'dang_xuat' %}"><i data-feather="log-out"> </i><span>Đăng xuất</span></a></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </div>
</div>
