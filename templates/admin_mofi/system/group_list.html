{% extends 'admin_mofi/base.html' %}
{% block content %}
<div class="container-fluid">
  <div class="page-title">
    <div class="row">
      <div class="col-6"><h4>Danh sách Nhóm Quyền (Roles)</h4></div>
      <div class="col-6 text-end">
        <a href="{% url 'students:mofi_group_add' %}" class="btn btn-primary"><i class="fa fa-plus"></i> Tạo Nhóm mới</a>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="table-responsive p-3">
      <table class="table table-hover">
        <thead class="bg-light">
          <tr>
            <th>ID</th>
            <th>Tên Nhóm Quyền</th>
            <th>Số lượng quyền chi tiết</th>
            <th>Thao tác</th>
          </tr>
        </thead>
        <tbody>
          {% for g in groups %}
          <tr>
            <td>#{{ g.id }}</td>
            <td class="fw-bold text-primary">{{ g.name }}</td>
            <td><span class="badge badge-info">{{ g.permissions.count }} quyền</span></td>
            <td>
              <a href="{% url 'students:mofi_group_edit' g.pk %}" class="btn btn-warning btn-xs"><i class="fa fa-edit"></i> Sửa</a>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
