{% extends 'admin_mofi/base.html' %}
{% block content %}
<div class="container-fluid">
    <div class="page-title">
        <div class="row align-items-center">
            <div class="col-6">
                <h4 class="fw-bold"><i class="fa fa-calendar-check-o text-primary me-2"></i>Quản lý Đợt thi</h4>
            </div>
            <div class="col-6 text-end">
                <a href="{% url 'students:mofi_import_lich_thi' %}" class="btn btn-warning fw-bold shadow-sm me-2">
                    <i class="fa fa-upload me-1"></i> Import từ Excel
                </a>
                <button class="btn btn-primary fw-bold shadow-sm"><i class="fa fa-plus me-1"></i> Tạo đợt thi</button>
            </div>
        </div>
    </div>
    <div class="row">
        {% for dt in dot_this %}
        <div class="col-xl-4 col-md-6 mb-4">
            <div class="card shadow-sm border-0 border-start border-4 {% if 'tin' in dt.ten_dot|lower %}border-info{% else %}border-success{% endif %}">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start">
                        <h6 class="fw-bold text-dark">{{ dt.ten_dot }}</h6>
                        <span class="badge bg-light text-primary border">{{ dt.ma_dot }}</span>
                    </div>
                    <div class="mt-3 small text-muted">
                        <p class="mb-1"><i class="fa fa-calendar me-2"></i>Ngày thi: <b>{{ dt.thoi_gian_bat_dau|date:"d/m/Y" }}</b></p>
                        <p class="mb-0"><i class="fa fa-users me-2"></i>Thí sinh: <b class="text-danger">{{ dt.lich_su_thi.count }}</b></p>
                    </div>
                </div>
                <div class="card-footer bg-white border-0 py-3">
                    <a href="{% url 'students:mofi_dot_thi_detail' dt.id %}" class="btn btn-sm btn-outline-primary w-100 fw-bold">
                        Quản lý Lịch & Điểm <i class="fa fa-arrow-right ms-1"></i>
                    </a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
