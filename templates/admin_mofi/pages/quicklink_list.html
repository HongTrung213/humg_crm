{% extends 'admin_mofi/base.html' %}
{% block content %}
<div class="container-fluid">
  <div class="page-title">
    <div class="row">
      <div class="col-6"><h4>Danh sách Liên kết nhanh</h4></div>
      <div class="col-6 text-end">
        <a href="{% url 'cms:mofi_quicklink_add' %}" class="btn btn-success"><i class="fa fa-plus"></i> Thêm liên kết</a>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="table-responsive p-3">
      <table class="table table-hover">
        <thead>
          <tr>
            <th>Banner</th>
            <th>Tên liên kết</th>
            <th>Thứ tự</th>
            <th>Trạng thái</th>
            <th>Thao tác</th>
          </tr>
        </thead>
        <tbody>
          {% for q in quicklinks %}
          <tr>
            <td><img src="{{ q.image.url }}" style="height: 40px; border-radius: 4px;"></td>
            <td>{{ q.title }}</td>
            <td>{{ q.order }}</td>
            <td>
              {% if q.is_active %}<span class="badge badge-success">Bật</span>
              {% else %}<span class="badge badge-danger">Tắt</span>{% endif %}
            </td>
            <td>
              <a href="{% url 'cms:mofi_quicklink_edit' q.pk %}" class="btn btn-warning btn-xs"><i class="fa fa-edit"></i></a>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
